version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
  customHeaders:
    - pattern: "**/*"
      headers:
        - key: "Content-Security-Policy"
          value: "default-src 'self'; base-uri 'self'; connect-src 'self' https://*.amazonaws.com https://*.appsync-api.us-east-1.amazonaws.com https://*.appsync-realtime-api.us-east-1.amazonaws.com https://worldtimeapi.org; font-src 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'; upgrade-insecure-requests"
        - key: "Cross-Origin-Opener-Policy"
          value: "same-origin"
        - key: "Cross-Origin-Resource-Policy"
          value: "same-origin"
        - key: "Permissions-Policy"
          value: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
        - key: "Referrer-Policy"
          value: "no-referrer"
        - key: "Strict-Transport-Security"
          value: "max-age=31536000; includeSubDomains"
        - key: "X-Content-Type-Options"
          value: "nosniff"
        - key: "X-Frame-Options"
          value: "DENY"
